name: VM checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  compose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: bash tests/compose_smoke.sh
  migrations:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: typhon
          POSTGRES_PASSWORD: typhon_test
          POSTGRES_DB: typhon_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U typhon -d typhon_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://typhon:typhon_test@localhost:5432/typhon_test?sslmode=disable
      TYPHON_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go build -o ./typhon-cli ./cmd/typhon
      - name: Verify migration and seed lifecycle
        run: |
          ./typhon-cli migrate plan examples/migrations
          ./typhon-cli migrate up examples/migrations
          ./typhon-cli migrate up examples/migrations
          ./typhon-cli migrate status examples/migrations
          ./typhon-cli migrate down examples/migrations
          ./typhon-cli migrate up examples/migrations
          ./typhon-cli migrate seed examples/seeds
  native-drivers:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: typhon
          POSTGRES_PASSWORD: typhon_test
          POSTGRES_DB: typhon_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U typhon -d typhon_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TYPHON_TEST_POSTGRES_URL: postgres://typhon:typhon_test@localhost:5432/typhon_test?sslmode=disable
      TYPHON_TEST_REDIS_URL: redis://localhost:6379/0
      CGO_ENABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test -race -count=1 ./internal/typhon -run TestNative -v
      - run: go test -race -count=1 ./cmd/typhon -run '^TestSIGTERMShutsDownActiveRequest$' -v
      - name: Verify rollback under docker stop
        timeout-minutes: 4
        run: bash tests/docker_shutdown.sh
      - run: go test ./internal/typhon -run '^$' -bench '^BenchmarkNativePostgresBulk$' -benchmem -benchtime=3x
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.12', '3.14']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Select bridge Python
        shell: bash
        run: echo "TYPHON_PYTHON=$(python -c 'import sys; print(sys.executable)')" >> "$GITHUB_ENV"
      - run: go test -count=1 -cover ./...
      - run: go vet ./...
      - run: python -m unittest discover -s tests
      - run: go build ./...
      - name: Validate exported OpenAPI
        if: runner.os == 'Linux' && matrix.python == '3.12'
        run: |
          python -m pip install 'openapi-spec-validator==0.7.2'
          go run ./cmd/typhon openapi examples/http_openapi.ty > openapi.json
          python -m openapi_spec_validator openapi.json
      - name: JSON fuzz smoke
        if: runner.os == 'Linux' && matrix.python == '3.12'
        run: go test ./internal/typhon -run '^$' -fuzz '^FuzzNativeJSON$' -fuzztime 5s -parallel 2
      - name: Race detector
        if: runner.os == 'Linux'
        env:
          CGO_ENABLED: '1'
        run: go test -race -count=1 ./...
