name: Performance and resilience
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
    paths: ['cmd/**', 'internal/**', 'tests/**', 'examples/compose/**', 'compose.yaml', 'Dockerfile', 'go.*', '.github/workflows/performance.yml']
  workflow_dispatch:
    inputs:
      soak_minutes:
        description: Soak length in minutes (1 to 45)
        required: true
        default: '30'
permissions:
  contents: read
jobs:
  performance-smoke:
    if: github.event_name == 'pull_request' && github.event.action != 'labeled'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      TYPHON_PERF_OUTPUT: performance-results
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - run: bash tests/performance.sh smoke
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: performance-smoke
          path: performance-results
  performance-soak:
    if: github.event_name == 'workflow_dispatch' || (github.event.action == 'labeled' && github.event.label.name == 'performance-soak' && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      TYPHON_PERF_OUTPUT: performance-results
      TYPHON_SOAK_MINUTES: ${{ inputs.soak_minutes || '30' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - run: bash tests/performance.sh soak
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: performance-soak
          path: performance-results
