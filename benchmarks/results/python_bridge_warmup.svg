<svg xmlns="http://www.w3.org/2000/svg" width="860" height="330" viewBox="0 0 860 330">
<style>
text{font-family:Segoe UI,Arial,sans-serif;fill:#1f2937}
.title{font-size:26px;font-weight:700}
.subtitle{font-size:14px;fill:#64748b}
.label{font-size:14px}
.value{font-size:13px;fill:#334155}
.grid{stroke:#e2e8f0;stroke-width:1}
</style>
<rect width="100%" height="100%" fill="#f8fafc"/>
<text class="title" x="34" y="42">Python Bridge Warmup</text>
<text class="subtitle" x="34" y="66">Median cold-process runtime, milliseconds. Lower is better.</text>
<line class="grid" x1="190.0" y1="68" x2="190.0" y2="250"/>
<text class="subtitle" x="190.0" y="276" text-anchor="middle">0</text>
<line class="grid" x1="312.0" y1="68" x2="312.0" y2="250"/>
<text class="subtitle" x="312.0" y="276" text-anchor="middle">100</text>
<line class="grid" x1="434.0" y1="68" x2="434.0" y2="250"/>
<text class="subtitle" x="434.0" y="276" text-anchor="middle">200</text>
<line class="grid" x1="556.0" y1="68" x2="556.0" y2="250"/>
<text class="subtitle" x="556.0" y="276" text-anchor="middle">300</text>
<line class="grid" x1="678.0" y1="68" x2="678.0" y2="250"/>
<text class="subtitle" x="678.0" y="276" text-anchor="middle">400</text>
<line class="grid" x1="800.0" y1="68" x2="800.0" y2="250"/>
<text class="subtitle" x="800.0" y="276" text-anchor="middle">500</text>
<text class="label" x="176" y="112" text-anchor="end">Python direct</text>
<rect x="190" y="94" width="318.3" height="24" rx="5" fill="#3776ab"/>
<text class="value" x="516.3" y="111">260.87 ms</text>
<text class="label" x="176" y="166" text-anchor="end">Typhon cold bridge</text>
<rect x="190" y="148" width="516.1" height="24" rx="5" fill="#00add8"/>
<text class="value" x="714.1" y="165">423.04 ms</text>
<text class="label" x="176" y="220" text-anchor="end">Typhon warm bridge</text>
<rect x="190" y="202" width="494.6" height="24" rx="5" fill="#14b8a6"/>
<text class="value" x="692.6" y="219">405.43 ms</text>
</svg>