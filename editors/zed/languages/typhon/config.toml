name = "Typhon"
grammar = "typhon"
path_suffixes = ["ty"]
line_comments = ["# "]
tab_size = 4
hard_tabs = false
increase_indent_pattern = '^\s*(?:def|class|if|elif|else|while|for)\b.*:\s*(?:#.*)?$'
brackets = [
    { start = "(", end = ")", close = true, newline = true },
    { start = "[", end = "]", close = true, newline = true },
    { start = "{", end = "}", close = true, newline = true },
    { start = "\"", end = "\"", close = true, newline = false, not_in = ["string", "comment"] },
    { start = "'", end = "'", close = true, newline = false, not_in = ["string", "comment"] },
]
